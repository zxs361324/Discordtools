name: Build Discord Tools APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'DiscordTools-Android-Project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o DiscordTools-Android-Project.zip -d .
          test -f DiscordTools/settings.gradle
          test -f DiscordTools/app/build.gradle
          test -f DiscordTools/app/src/main/AndroidManifest.xml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept licenses and install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p DiscordTools --no-daemon assembleDebug

      - name: Verify APK
        run: |
          test -f DiscordTools/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DiscordTools-APK
          path: DiscordTools/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
